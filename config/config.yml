# Kinetic Typography pipeline configuration
# Edit values here — no code changes needed to change styling/output.

resolution:
  width: 1080
  height: 1920
  fps: 30

# reveal: "popin" | "karaoke" | "focus-word" | "clean-feed" | "orbit"
reveal:
  style: popin

text:
  fontFamily: Inter
  size: 110
  color: "#111111"
  highlightColor: "#1a6b1a"
  strokeColor: "#000000"
  strokeWidth: 6
  position: center # center | lower-third

background:
  # type: solid | gradient | image | video | waveform
  # image/video need a file in public/; falls back to the light-grey solid if unset
  type: solid
  solid: "#d3d3d3"
  gradient:
    from: "#0f2027"
    to: "#2c5364"
    direction: vertical
  image: ""            # path inside project, e.g. public/bg.jpg
  video: ""            # path inside project, e.g. public/bg-loop.mp4
  waveform:
    color: "#f5c518"

output:
  directory: output
  container: mp4       # mp4 only for v1
  crf: 18

# Used by the "orbit" style (episode title card + radial spectrum)
branding:
  host: Sarah Connor        # displayed big; falls back to first letter on the cover disc
  tag: On building calm software
  episode: EP. 12
  coverImage: ""            # path inside public/, e.g. public/cover.jpg






